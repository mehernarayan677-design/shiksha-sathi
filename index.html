];const subjectNames={"odia": "ଓଡ଼ିଆ", "english": "English", "math": "ଗଣିତ", "evs": "ପରିବେଶ"};let grade=1,sub='odia',idx=0;const $=id=>document.getElementById(id);function show(id){['picker','list','detail'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}function saveName(){localStorage.setItem('ss-name',$('student').value);progress()}$('student').value=localStorage.getItem('ss-name')||'';function progress(){let done=Object.keys(localStorage).filter(k=>k.startsWith('ss-done-')).length;$('progress').textContent='Completed quizzes: '+done}function chooseGrade(g){grade=g;$('gradeTitle').textContent='Class '+g+' – Subject';$('subjects').innerHTML=Object.entries(subjectNames).map(([k,v])=>`<button onclick="chooseSubject('${k}')">${v}</button>`).join('')}function getLessons(){return grade===1&&sub==='odia'?oldOdia.map(x=>[x[0],x[1],x[2],x[3],x[4]]):allLessons[grade+'-'+sub]}function chooseSubject(s){sub=s;$('listTitle').textContent='Class '+grade+' – '+subjectNames[s];$('lessonList').innerHTML=getLessons().map((d,i)=>`<div class="lesson"><button onclick="openLesson(${i})">ପାଠ ${i+1}: ${d[0]}</button> ${localStorage.getItem('ss-done-'+grade+'-'+sub+'-'+i)?'✅':''}</div>`).join('');show('list')}function openLesson(i){idx=i;let d=getLessons()[i];$('lessonTitle').textContent='ପାଠ '+(i+1)+': '+d[0];$('content').innerHTML=d[1];$('question').textContent=d[2];$('answers').innerHTML=d[3].map((a,j)=>`<button onclick="check(${j})">${a}</button>`).join('');$('feedback').textContent='';show('detail')}function check(j){let d=getLessons()[idx],correct=j===d[4];$('feedback').textContent=correct?'✅ Correct!':'Try again.';$('feedback').className=correct?'good':'';if(correct){localStorage.setItem('ss-done-'+grade+'-'+sub+'-'+idx,'1');progress()}}function nextLesson(){if(idx+1<getLessons().length)openLesson(idx+1);else chooseSubject(sub)}function readLesson(){if(!('speechSynthesis'in window)){alert('Voice not supported');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('content').textContent);u.lang=sub==='english'?'en-IN':'or-IN';speechSynthesis.speak(u)}$('grades').innerHTML=[1,2,3,4,5].map(g=>`<button onclick="chooseGrade(${g})">Class ${g}</button>`).join('');chooseGrade(1);progress();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
